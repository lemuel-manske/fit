name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Formatting
        run: gofmt -d fit
      - name: Start broker with restricted credentials
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Unit and integration tests
        env:
          FIT_BROKER_URL: amqp://fit:replace-with-a-random-password@localhost:5672/fit
        run: go test -race ./...
      - name: Windows build
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: Broker logs
        if: failure()
        run: docker compose logs rabbitmq
