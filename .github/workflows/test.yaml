name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Formatting
        run: gofmt -d fit
      - name: Start broker with restricted credentials
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Unit and integration tests
        env:
          FIT_BROKER_URL: amqp://fit:replace-with-a-random-password@localhost:5672/fit
        run: go test -race ./...
      - name: Clone binary content through serve
        env:
          FIT_BROKER_URL: amqp://fit:replace-with-a-random-password@localhost:5672/fit
        run: |
          go build -o /tmp/fit .
          demo_dir=$(mktemp -d)
          mkdir "$demo_dir/source"
          cd "$demo_dir/source"
          /tmp/fit init
          printf '\000\377\200binary\n' > content.bin
          /tmp/fit add content.bin
          /tmp/fit commit -m binary
          /tmp/fit serve &
          serve_pid=$!
          trap 'kill "$serve_pid"' EXIT
          sleep 2
          /tmp/fit clone source "$demo_dir/clone"
          cmp content.bin "$demo_dir/clone/content.bin"
      - name: TLS integration
        run: |
          mkdir -p docker/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout docker/certs/ca-key.pem -out docker/certs/ca.pem -subj /CN=Fit-CA -days 1
          openssl req -newkey rsa:2048 -nodes -keyout docker/certs/server-key.pem -out docker/certs/server.csr -subj /CN=localhost
          printf 'subjectAltName=DNS:localhost\nextendedKeyUsage=serverAuth\n' > docker/certs/extensions
          openssl x509 -req -in docker/certs/server.csr -CA docker/certs/ca.pem -CAkey docker/certs/ca-key.pem -CAcreateserial -out docker/certs/server.pem -days 1 -extfile docker/certs/extensions
          chmod 644 docker/certs/server-key.pem
          docker compose down
          docker compose -f compose.yaml -f compose.tls.yaml up -d --build --wait
          FIT_BROKER_URL=amqps://fit:replace-with-a-random-password@localhost:5671/fit FIT_BROKER_CA_FILE="$PWD/docker/certs/ca.pem" go test -race ./fit/transport
      - name: Windows build
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: Broker logs
        if: failure()
        run: docker compose logs rabbitmq
