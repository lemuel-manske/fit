services:
  rabbitmq:
    build:
      context: .
      dockerfile: ./docker/rabbitmq.dockerfile
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${FIT_BROKER_USER:?Set FIT_BROKER_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${FIT_BROKER_PASSWORD:?Set FIT_BROKER_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: fit
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data:
  rabbitmq_log:

